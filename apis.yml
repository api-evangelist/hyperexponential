aid: hyperexponential
name: hyperexponential
description: >-
  hyperexponential (hx) is a London-based insurtech that builds the #1 pricing and
  underwriting decision platform for commercial property & casualty (P&C) insurance.
  Its platform - spanning the Hyperoperator agentic assistant, a no-code Workflow
  Builder, Calculation Engines, and Portfolio Intelligence - lets actuaries and
  underwriters build, deploy, and iterate pricing models and underwriting workflows
  without heavy engineering. Carriers use hx to automate submission triage, risk
  assessment, renewals, portfolio monitoring, and regulatory compliance, with top
  global carriers running $75bn+ in annual commercial P&C premium on the platform.
  hyperexponential is backed by a16z and Battery Ventures. This API Evangelist
  profile tracks the company's public developer, security, and compliance surface;
  hx does not publish a public developer portal or OpenAPI, so this repo is enriched
  from identity, trust-center, and domain-security signals.
